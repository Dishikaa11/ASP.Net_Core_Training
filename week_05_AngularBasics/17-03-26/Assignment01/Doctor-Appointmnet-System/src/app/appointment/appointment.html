<h2>🏥 Doctor Appointment System</h2>

<form>

  <label>Patient Name:</label><br>
  <input type="text" [(ngModel)]="patientName" name="name"><br><br>

  <label>Select Doctor:</label><br>
  <select [(ngModel)]="doctor" name="doctor">
    <option value="">--Select--</option>
    <option *ngFor="let doc of doctors" [value]="doc">{{ doc }}</option>
  </select><br><br>

  <label>Appointment Date:</label><br>
  <input type="date" [(ngModel)]="date" name="date" [min]="today"><br><br>

  <label>Consultation Type:</label><br>
  <select [(ngModel)]="consultationType" name="type" (change)="updateFee()">
    <option value="">--Select--</option>
    <option value="Online">Online</option>
    <option value="Offline">Offline</option>
  </select><br><br>

  <label>Symptoms:</label><br>
  <textarea [(ngModel)]="symptoms" name="symptoms"></textarea><br><br>

  <button type="button" (click)="bookAppointment()">Book Appointment</button>

</form>

<hr>

<h3>📋 Appointment Summary</h3>

<p><b>Name:</b> {{ patientName }}</p>
<p><b>Doctor:</b> {{ doctor }}</p>
<p><b>Date:</b> {{ date }}</p>
<p><b>Type:</b> {{ consultationType }}</p>
<p><b>Symptoms:</b> {{ symptoms }}</p>
<p><b>Fee:</b> ₹{{ fee }}</p>

<h3>{{ message }}</h3>
